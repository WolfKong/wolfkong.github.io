<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Space Attack</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="game-page">
      <header>
        <h1>Space Attack</h1>
        <p>A / ← and D / → to move · Space or click to fire</p>
      </header>
      <section class="game-container" aria-label="Space Attack game">
        <canvas id="game-canvas"></canvas>
        <div id="start-screen" class="game-screen">
          <div>
            <h2>Space Attack</h2>
            <p>Destroy the armada before it destroys you.</p>
            <button id="start-button" type="button">Start Game</button>
          </div>
        </div>
        <div id="game-over-screen" class="game-screen is-hidden">
          <div>
            <h2>Game Over</h2>
            <p id="game-over-summary"></p>
            <button id="restart-button" type="button">Restart</button>
          </div>
        </div>
      </section>
    </main>
    <script type="module" src="./js/game.js"></script>
  </body>
</html>
